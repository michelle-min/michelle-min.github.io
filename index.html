<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>michelle on the intrnet</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 80px 24px;
      background: #101014;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: -0.05em;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.3rem;
    }

    .projects {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 60px;
    }

    .card {
      padding: 32px;
      border: 1px solid #333;
      border-radius: 12px;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #888;
    }

    .card h2 {
      font-size: 1.4rem;
    }

    .card p {
      color: #aaa;
    }
  </style>
</head>

<body>

<main>

  <h1>Data. Code. Creativity.</h1>

  <p class="subtitle">
    Exploring the intersection of data science,
    visualization, and creative computation.
  </p>

  <section class="projects">

    <div class="card">
      <h2>Data Visualization</h2>
      <p>Interactive stories told through data.</p>
    </div>

    <div class="card">
      <h2>Data Science</h2>
      <p>Finding patterns in complex systems.</p>
    </div>

    <div class="card">
      <h2>Creative Coding</h2>
      <p>Experiments in generative art.</p>
    </div>

  </section>

</main>

</body>
</html>
